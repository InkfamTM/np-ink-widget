<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink Now Playing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Rubik:wght@500&display=swap" rel="stylesheet">
<!--
  INK NOW PLAYING: a Spotify "now playing" widget for OBS.

  SETUP (one time)
  1. Create an app at https://developer.spotify.com/dashboard
  2. Add a Redirect URI that is EXACTLY the address you open this page at, e.g.
       http://127.0.0.1:8888/nowplaying.html
     (Spotify does not accept "localhost"; use 127.0.0.1 or an https address.)
  3. Paste the app's Client ID into CLIENT_ID below.
  4. Serve this folder, e.g. run:  python -m http.server 8888 --bind 127.0.0.1
  5. In OBS add a Browser Source with that same URL, size 580 x 190.
  6. Right-click the source > Interact > click "Connect Spotify" and approve.
     After that it logs itself in automatically.

  PREVIEW: while CLIENT_ID is unchanged (or if you add ?demo to the URL),
  the widget cycles through fake songs so you can see the look.
-->
<style>
  :root { --a:#ff3d9a; --b:#c6ff1a; --ink:#15121c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:580px; height:190px; overflow:hidden; background:transparent; }
  body { font-family:'Rubik', system-ui, sans-serif; color:#fff; }

  #stage {
    position:relative; width:580px; height:190px;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,1.4,.4,1);
  }
  #stage.hidden { opacity:0; transform:translateY(14px) scale(.96); }

  /* ---------- ink splats ---------- */
  .splat { position:absolute; pointer-events:none; color:var(--a); }
  .splat svg { width:100%; height:100%; overflow:visible; fill:currentColor; transform-origin:50% 50%; }
  #splatA { left:-22px; top:-30px; width:190px; height:190px; color:var(--a); }
  #splatB { right:-10px; bottom:-14px; width:150px; height:150px; color:var(--b); }
  .splat.pop svg { animation:splatpop .65s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes splatpop {
    0%   { transform:scale(0) rotate(-25deg); }
    60%  { transform:scale(1.15) rotate(4deg); }
    100% { transform:scale(1) rotate(0); }
  }

  /* ---------- card ---------- */
  #card {
    position:absolute; left:30px; top:26px; right:30px; bottom:30px;
    display:flex; align-items:center; gap:16px; padding:14px 18px 14px 14px;
    background:var(--ink);
    border:3px solid var(--a); border-radius:22px;
    box-shadow:6px 6px 0 var(--b);
    transform:rotate(-1deg);
  }
  #card.pop { animation:cardpop .55s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes cardpop {
    0%   { transform:rotate(-1deg) translateX(-28px) scale(.94); opacity:0; }
    100% { transform:rotate(-1deg) translateX(0) scale(1); opacity:1; }
  }

  #art {
    flex:none; width:88px; height:88px; border-radius:16px;
    border:3px solid var(--b);
    background:linear-gradient(135deg, var(--a), var(--b));
    background-size:cover; background-position:center;
    box-shadow:3px 3px 0 var(--a);
    transform:rotate(2.5deg);
  }

  #info { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  #label {
    align-self:flex-start;
    font-family:'Paytone One','Arial Black',sans-serif;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink); background:var(--b);
    padding:2px 9px 1px; border-radius:999px;
    transform:rotate(-2deg);
  }
  .clip { overflow:hidden; white-space:nowrap; padding-bottom:2px; }
  .clip span { display:inline-block; }
  #title {
    font-family:'Paytone One','Arial Black',sans-serif;
    font-size:24px; line-height:1.15;
  }
  #artist { font-size:16px; line-height:1.2; color:var(--a); }
  .scroll { animation:slide var(--dur,8s) ease-in-out 1.5s infinite alternate; }
  @keyframes slide { from { transform:translateX(0); } to { transform:translateX(var(--shift,0px)); } }

  /* ---------- progress ink bar ---------- */
  #bar { position:relative; height:10px; margin-top:6px; background:rgba(255,255,255,.14); border-radius:999px; }
  #fill {
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--a); border-radius:999px;
    transition:width .25s linear;
  }
  #fill::after {
    content:''; position:absolute; right:-7px; top:50%;
    width:20px; height:20px; margin-top:-10px;
    background:var(--a); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  #fill::before {
    content:''; position:absolute; right:-21px; top:-6px;
    width:6px; height:6px; background:var(--a); border-radius:50%;
  }

  /* ---------- connect screen ---------- */
  #connect { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  #stage.connecting #connect { display:flex; }
  #stage.connecting #card { display:none; }
  #connect > div { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #connectBtn {
    font-family:'Paytone One','Arial Black',sans-serif; font-size:24px;
    color:var(--ink); background:var(--b);
    border:3px solid var(--ink); border-radius:18px; padding:10px 26px;
    box-shadow:5px 5px 0 var(--a); cursor:pointer; transform:rotate(-1.5deg);
  }
  #connectBtn:active { transform:rotate(-1.5deg) translate(2px,2px); box-shadow:3px 3px 0 var(--a); }
  #msg {
    font-size:13px; color:#fff; background:rgba(21,18,28,.92);
    padding:4px 12px; border-radius:10px; text-align:center; max-width:400px;
  }
  #msg:empty { display:none; }
</style>
</head>
<body>
<div id="stage" class="hidden">
  <div class="splat" id="splatA"></div>
  <div class="splat" id="splatB"></div>

  <div id="card">
    <div id="art"></div>
    <div id="info">
      <div id="label">Now Playing</div>
      <div class="clip"><span id="title"></span></div>
      <div class="clip"><span id="artist"></span></div>
      <div id="bar"><div id="fill"></div></div>
    </div>
  </div>

  <div id="connect">
    <div>
      <button id="connectBtn" type="button">Connect Spotify</button>
      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ================= SETTINGS ================= */
  const CLIENT_ID = 'e42ada6a1300404089e7209d1a667064';  // from the Spotify developer dashboard
  const POLL_MS = 3000;                        // how often to ask Spotify what's playing
  const HIDE_WHEN_PAUSED = true;               // fade the widget out when nothing is playing
  const REDIRECT_URI = '';                     // leave empty to use this page's own address
  /* ============================================ */

  const REDIRECT = REDIRECT_URI || (location.origin + location.pathname);

  // [main ink color, accent ink color]; each song picks one pair
  const PALETTES = [
    ['#ff3d9a', '#c6ff1a'],
    ['#1fd8ff', '#ff7a1a'],
    ['#a066ff', '#ffe600'],
    ['#35e07a', '#ff35d6'],
    ['#ff5a36', '#27e0c2']
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), card = $('card'), art = $('art');
  const titleEl = $('title'), artistEl = $('artist'), fill = $('fill');
  const splatA = $('splatA'), splatB = $('splatB');
  const connectBtn = $('connectBtn'), msg = $('msg');

  /* ---------- tiny helpers ---------- */
  const f = x => x.toFixed(1);

  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  const store = {
    get(k) { try { return localStorage.getItem('inknp_' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('inknp_' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem('inknp_' + k); } catch (e) {} }
  };

  /* ---------- procedural ink splat ---------- */
  function splatSVG(seed) {
    const rnd = mulberry32(seed);
    const n = 13, R = 62, pts = [];
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + (rnd() - 0.5) * 0.25;
      const spike = rnd() < 0.42;
      const rad = R * (spike ? 1.15 + rnd() * 0.55 : 0.7 + rnd() * 0.25);
      pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
    }
    let d = `M ${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C ${f(c1[0])} ${f(c1[1])}, ${f(c2[0])} ${f(c2[1])}, ${f(p2[0])} ${f(p2[1])}`;
    }
    d += ' Z';
    let drops = '';
    const count = 4 + Math.floor(rnd() * 3);
    for (let i = 0; i < count; i++) {
      const ang = rnd() * Math.PI * 2;
      const dist = R * (1.5 + rnd() * 0.6);
      const r = 3 + rnd() * 7;
      drops += `<circle cx="${f(Math.cos(ang) * dist)}" cy="${f(Math.sin(ang) * dist)}" r="${f(r)}"/>`;
    }
    return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg"><path d="${d}"/>${drops}</svg>`;
  }

  function setPalette(seed) {
    const pal = PALETTES[seed % PALETTES.length];
    stage.style.setProperty('--a', pal[0]);
    stage.style.setProperty('--b', pal[1]);
  }

  /* ---------- text that scrolls only when it has to ---------- */
  function fit(el) {
    el.classList.remove('scroll');
    el.style.removeProperty('--shift');
    const over = el.offsetWidth - el.parentElement.clientWidth;
    if (over > 4) {
      el.style.setProperty('--shift', `-${over + 12}px`);
      el.style.setProperty('--dur', `${Math.max(5, over / 28)}s`);
      el.classList.add('scroll');
    }
  }

  /* ---------- show a track ---------- */
  let currentKey = null;
  function showTrack(t) {
    if (t.id !== currentKey) {
      currentKey = t.id;
      const seed = hashStr(String(t.id));
      setPalette(seed);
      splatA.innerHTML = splatSVG(seed);
      splatB.innerHTML = splatSVG(seed ^ 0x9e3779b9);
      titleEl.textContent = t.title;
      artistEl.textContent = t.artist;
      art.style.backgroundImage = t.art ? `url("${t.art}")` : '';
      retrigger(splatA, 'pop'); retrigger(splatB, 'pop'); retrigger(card, 'pop');
      requestAnimationFrame(() => { fit(titleEl); fit(artistEl); });
    }
  }
  function setVisible(v) { stage.classList.toggle('hidden', !v); }

  /* ---------- progress bar (interpolated between polls) ---------- */
  let prog = { pos: 0, dur: 1, playing: false, at: performance.now() };
  setInterval(() => {
    let pos = prog.pos + (prog.playing ? performance.now() - prog.at : 0);
    pos = Math.max(0, Math.min(pos, prog.dur));
    fill.style.width = (prog.dur ? (pos / prog.dur) * 100 : 0).toFixed(2) + '%';
  }, 200);

  /* ---------- Spotify login (PKCE, no secret needed) ---------- */
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  function randomString(len) {
    const a = new Uint8Array(len);
    crypto.getRandomValues(a);
    return b64url(a).slice(0, len);
  }

  async function startAuth() {
    try {
      const verifier = randomString(96);
      const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
      store.set('verifier', verifier);
      const p = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT,
        code_challenge_method: 'S256',
        code_challenge: challenge,
        scope: 'user-read-currently-playing'
      });
      location.href = 'https://accounts.spotify.com/authorize?' + p.toString();
    } catch (e) {
      showConnect('Could not start login (needs 127.0.0.1 or https)');
    }
  }

  async function tokenRequest(params) {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(Object.assign({ client_id: CLIENT_ID }, params))
    });
    if (!r.ok) { const err = new Error('token ' + r.status); err.status = r.status; throw err; }
    const j = await r.json();
    store.set('access', j.access_token);
    if (j.refresh_token) store.set('refresh', j.refresh_token);
    store.set('exp', String(Date.now() + (j.expires_in - 60) * 1000));
    return j.access_token;
  }

  function clearTokens() { ['access', 'refresh', 'exp'].forEach(k => store.del(k)); }

  // returns a token, or null if the user needs to connect; throws on temporary trouble
  async function accessToken() {
    const a = store.get('access'), exp = Number(store.get('exp') || 0);
    if (a && Date.now() < exp) return a;
    const rt = store.get('refresh');
    if (!rt) return null;
    try {
      return await tokenRequest({ grant_type: 'refresh_token', refresh_token: rt });
    } catch (e) {
      if (e.status === 400 || e.status === 401) { clearTokens(); return null; }
      throw e;
    }
  }

  async function handleCallback() {
    const qs = new URLSearchParams(location.search);
    const code = qs.get('code'), err = qs.get('error');
    if (!code && !err) return;
    history.replaceState({}, '', location.pathname);
    if (err) { showConnect('Spotify said: ' + err); return; }
    try {
      await tokenRequest({
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT,
        code_verifier: store.get('verifier') || ''
      });
      store.del('verifier');
    } catch (e) {
      showConnect('Login failed, please try again');
    }
  }

  function showConnect(m) {
    if (!splatA.innerHTML) { splatA.innerHTML = splatSVG(7); splatB.innerHTML = splatSVG(11); }
    setPalette(0);
    stage.classList.remove('hidden');
    stage.classList.add('connecting');
    msg.textContent = m || '';
  }
  function hideConnect() { stage.classList.remove('connecting'); msg.textContent = ''; }

  /* ---------- polling ---------- */
  function nothingPlaying() { prog.playing = false; setVisible(false); }

  function handlePlayback(j) {
    const it = j && j.item;
    if (!it || j.currently_playing_type === 'ad') return nothingPlaying();
    const imgs = (it.album && it.album.images) || it.images || [];
    const img = imgs[1] || imgs[0] || {};
    const artist = it.artists
      ? it.artists.map(a => a.name).join(', ')
      : ((it.show && it.show.name) || '');
    prog = { pos: j.progress_ms || 0, dur: it.duration_ms || 1, playing: !!j.is_playing, at: performance.now() };
    if (!j.is_playing && HIDE_WHEN_PAUSED) return setVisible(false);
    showTrack({ id: it.id || it.uri || it.name, title: it.name, artist, art: img.url || '' });
    setVisible(true);
  }

  async function poll() {
    let wait = POLL_MS;
    try {
      const tok = await accessToken();
      if (!tok) { showConnect(); return; }          // wait for the user to connect
      hideConnect();
      const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', {
        headers: { Authorization: 'Bearer ' + tok }
      });
      if (r.status === 204) nothingPlaying();
      else if (r.status === 200) handlePlayback(await r.json());
      else if (r.status === 401) { store.del('exp'); wait = 500; }
      else if (r.status === 429) wait = ((Number(r.headers.get('Retry-After')) || 5) * 1000) + 500;
      else { console.warn('[ink-now-playing] Spotify returned', r.status); wait = 10000; }
    } catch (e) {
      console.warn('[ink-now-playing]', e);
      wait = 5000;
    }
    setTimeout(poll, wait);
  }

  /* ---------- demo / preview ---------- */
  function runDemo() {
    const songs = [
      { id: 'demo-1', title: 'Paint the Town Loud', artist: 'The Splatter Club' },
      { id: 'demo-2', title: 'A Very Long Song Title That Has To Scroll Across The Whole Card', artist: 'Various Artists, Featuring Several Different Names' },
      { id: 'demo-3', title: 'Midnight Drizzle', artist: 'Lo-Fi Puddles' },
      { id: 'demo-4', title: 'Ink Rush', artist: 'Tidal Kids' }
    ];
    let i = 0;
    const next = () => {
      prog = { pos: 70000, dur: 240000, playing: true, at: performance.now() };
      showTrack(songs[i]);
      setVisible(true);
      i = (i + 1) % songs.length;
    };
    next();
    setInterval(next, 9000);
  }

  /* ---------- go ---------- */
  connectBtn.addEventListener('click', startAuth);

  (async function main() {
    const demo = new URLSearchParams(location.search).has('demo') || CLIENT_ID === 'YOUR_SPOTIFY_CLIENT_ID';
    if (demo) { runDemo(); return; }
    await handleCallback();
    poll();
  })();
})();
</script>
</body>
</html>
